<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; fill: #64748b; }
      .lane-label { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .stage-num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .stage-name { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .stage-desc { font-size: 10px; fill: #475569; }
      .sheet-tab { font-size: 11px; fill: #1e293b; }
      .legend-text { font-size: 11px; fill: #334155; }
      .arrow-label { font-size: 10px; fill: #475569; font-style: italic; }
      .footer { font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" class="title">NEXUS Scoring Engine — Architecture (v1.0)</text>
  <text x="600" y="54" text-anchor="middle" class="subtitle">Two workflows. One Google Sheet. Zero LLM cost per execution. Domain-agnostic via config_pack switching.</text>

  <!-- ==================== LANE 1: CORE ENGINE (event-driven) ==================== -->
  <rect x="30" y="80" width="1140" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="105" class="lane-label">⚡ Core Engine — event-driven (fires per webhook event)</text>

  <!-- Webhook Source -->
  <rect x="50" y="180" width="100" height="60" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="204" text-anchor="middle" class="stage-name">Webhook</text>
  <text x="100" y="220" text-anchor="middle" class="stage-desc">any source</text>
  <text x="100" y="232" text-anchor="middle" class="stage-desc">HTTP POST JSON</text>

  <!-- Stage 1: Ingest / Validate -->
  <rect x="180" y="180" width="110" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="195" cy="195" r="10" fill="#475569"/>
  <text x="195" y="199" text-anchor="middle" class="stage-num">1</text>
  <text x="225" y="199" text-anchor="middle" class="stage-name">Validate</text>
  <text x="235" y="216" text-anchor="middle" class="stage-desc">required fields</text>
  <text x="235" y="228" text-anchor="middle" class="stage-desc">HTTP 400 on miss</text>

  <!-- Stage 2: Load Config -->
  <rect x="320" y="180" width="110" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="335" cy="195" r="10" fill="#475569"/>
  <text x="335" y="199" text-anchor="middle" class="stage-num">2</text>
  <text x="375" y="199" text-anchor="middle" class="stage-name">Load Config</text>
  <text x="375" y="216" text-anchor="middle" class="stage-desc">Sheets reads ×3</text>
  <text x="375" y="228" text-anchor="middle" class="stage-desc">filter config_pack</text>

  <!-- Stage 3: Score -->
  <rect x="460" y="180" width="110" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="475" cy="195" r="10" fill="#475569"/>
  <text x="475" y="199" text-anchor="middle" class="stage-num">3</text>
  <text x="515" y="199" text-anchor="middle" class="stage-name">Score</text>
  <text x="515" y="216" text-anchor="middle" class="stage-desc">loop active rules</text>
  <text x="515" y="228" text-anchor="middle" class="stage-desc">sum weights</text>

  <!-- Stage 4: Classify -->
  <rect x="600" y="180" width="110" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="615" cy="195" r="10" fill="#475569"/>
  <text x="615" y="199" text-anchor="middle" class="stage-num">4</text>
  <text x="655" y="199" text-anchor="middle" class="stage-name">Classify</text>
  <text x="655" y="216" text-anchor="middle" class="stage-desc">tier router</text>
  <text x="655" y="228" text-anchor="middle" class="stage-desc">RED/AMBER/GREEN</text>

  <!-- Stage 5: Route &amp; Notify (with sub-branches) -->
  <rect x="740" y="180" width="120" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="755" cy="195" r="10" fill="#475569"/>
  <text x="755" y="199" text-anchor="middle" class="stage-num">5</text>
  <text x="800" y="199" text-anchor="middle" class="stage-name">Route &amp; Notify</text>
  <text x="800" y="216" text-anchor="middle" class="stage-desc">Slack→Email→Log</text>
  <text x="800" y="228" text-anchor="middle" class="stage-desc">fallback chain</text>

  <!-- Stage 6: Write Item -->
  <rect x="890" y="160" width="105" height="50" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="905" cy="173" r="9" fill="#475569"/>
  <text x="905" y="177" text-anchor="middle" class="stage-num">6</text>
  <text x="942" y="177" text-anchor="middle" class="stage-name">Write Item</text>
  <text x="942" y="194" text-anchor="middle" class="stage-desc">append to Items</text>

  <!-- Stage 7: Audit Log -->
  <rect x="890" y="220" width="105" height="50" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="905" cy="233" r="9" fill="#475569"/>
  <text x="905" y="237" text-anchor="middle" class="stage-num">7</text>
  <text x="942" y="237" text-anchor="middle" class="stage-name">Audit Log</text>
  <text x="942" y="254" text-anchor="middle" class="stage-desc">append event</text>

  <!-- External destinations: Slack / Email / Items / Log -->
  <rect x="1025" y="120" width="135" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1092" y="136" text-anchor="middle" class="stage-name">Slack</text>
  <text x="1092" y="151" text-anchor="middle" class="stage-desc">RED → #channel</text>

  <rect x="1025" y="170" width="135" height="40" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1092" y="186" text-anchor="middle" class="stage-name">Email</text>
  <text x="1092" y="201" text-anchor="middle" class="stage-desc">AMBER / fallback</text>

  <rect x="1025" y="220" width="135" height="40" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1092" y="236" text-anchor="middle" class="stage-name">Auto-close</text>
  <text x="1092" y="251" text-anchor="middle" class="stage-desc">GREEN → audit only</text>

  <!-- Lane 1 arrows -->
  <line x1="150" y1="210" x2="180" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="210" x2="320" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="210" x2="460" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="210" x2="600" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="210" x2="740" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5 → 6 (Write Item) and 5 → 7 (Audit) — parallel -->
  <line x1="860" y1="200" x2="890" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="220" x2="890" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5 → external dests (color-coded by tier) -->
  <line x1="860" y1="195" x2="1025" y2="140" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <line x1="860" y1="210" x2="1025" y2="190" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <line x1="860" y1="225" x2="1025" y2="240" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>

  <text x="945" y="158" class="arrow-label">RED tier</text>
  <text x="945" y="200" class="arrow-label">AMBER tier</text>
  <text x="945" y="262" class="arrow-label">GREEN tier</text>

  <!-- ==================== CENTER: GOOGLE SHEETS ==================== -->
  <rect x="380" y="385" width="440" height="170" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">📊 Google Sheets — single source of truth</text>
  <text x="600" y="430" text-anchor="middle" class="subtitle">v1.0 data layer · v2.0 → Supabase upgrade path</text>

  <!-- Tab boxes: 6 tabs in 2 rows of 3 -->
  <rect x="400" y="445" width="125" height="40" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="462" y="461" text-anchor="middle" class="stage-name" style="font-size:11px">Scoring_Rules</text>
  <text x="462" y="476" text-anchor="middle" class="stage-desc">config (read)</text>

  <rect x="535" y="445" width="125" height="40" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="597" y="461" text-anchor="middle" class="stage-name" style="font-size:11px">Tier_Thresholds</text>
  <text x="597" y="476" text-anchor="middle" class="stage-desc">config (read)</text>

  <rect x="670" y="445" width="130" height="40" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="735" y="461" text-anchor="middle" class="stage-name" style="font-size:11px">Notification_Targets</text>
  <text x="735" y="476" text-anchor="middle" class="stage-desc">config (read)</text>

  <rect x="400" y="495" width="125" height="40" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="462" y="511" text-anchor="middle" class="stage-name" style="font-size:11px">SLA_Config</text>
  <text x="462" y="526" text-anchor="middle" class="stage-desc">config (read)</text>

  <rect x="535" y="495" width="125" height="40" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="597" y="511" text-anchor="middle" class="stage-name" style="font-size:11px">Items</text>
  <text x="597" y="526" text-anchor="middle" class="stage-desc">runtime (write)</text>

  <rect x="670" y="495" width="130" height="40" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="735" y="511" text-anchor="middle" class="stage-name" style="font-size:11px">Execution_Log</text>
  <text x="735" y="526" text-anchor="middle" class="stage-desc">audit (write)</text>

  <!-- Arrows from Stage 2 (Load Config) down to Sheets -->
  <line x1="375" y1="240" x2="450" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="385" y="320" class="arrow-label">read config</text>

  <!-- Arrows from Stage 6/7 down to Sheets Items + Log -->
  <line x1="942" y1="270" x2="800" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="855" y="335" class="arrow-label">append item + event</text>

  <!-- ==================== LANE 2: SLA MONITOR (scheduled) ==================== -->
  <rect x="30" y="580" width="1140" height="140" rx="10" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="605" class="lane-label">⏰ SLA Monitor — scheduled (every 5 min, premium only)</text>

  <!-- Schedule -->
  <rect x="50" y="635" width="100" height="60" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="100" y="660" text-anchor="middle" class="stage-name">Schedule</text>
  <text x="100" y="675" text-anchor="middle" class="stage-desc">trigger 5 min</text>
  <text x="100" y="687" text-anchor="middle" class="stage-desc">cron-style</text>

  <!-- M1 Read open -->
  <rect x="180" y="635" width="115" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="237" y="660" text-anchor="middle" class="stage-name">Read Open Items</text>
  <text x="237" y="675" text-anchor="middle" class="stage-desc">filter status=open</text>
  <text x="237" y="687" text-anchor="middle" class="stage-desc">tier=RED/HOT</text>

  <!-- M2 Check SLA -->
  <rect x="320" y="635" width="115" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="377" y="660" text-anchor="middle" class="stage-name">Check SLA</text>
  <text x="377" y="675" text-anchor="middle" class="stage-desc">created + sla_min</text>
  <text x="377" y="687" text-anchor="middle" class="stage-desc">vs now</text>

  <!-- M3 Escalate -->
  <rect x="460" y="635" width="115" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="517" y="660" text-anchor="middle" class="stage-name">Escalate</text>
  <text x="517" y="675" text-anchor="middle" class="stage-desc">Slack + Email</text>
  <text x="517" y="687" text-anchor="middle" class="stage-desc">to escalation_contact</text>

  <!-- M4 Update breach count -->
  <rect x="600" y="635" width="115" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="657" y="660" text-anchor="middle" class="stage-name">Update Item</text>
  <text x="657" y="675" text-anchor="middle" class="stage-desc">sla_breaches +1</text>
  <text x="657" y="687" text-anchor="middle" class="stage-desc">on Items row</text>

  <!-- M5 Audit -->
  <rect x="740" y="635" width="115" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="797" y="660" text-anchor="middle" class="stage-name">SLA Audit</text>
  <text x="797" y="675" text-anchor="middle" class="stage-desc">append event to</text>
  <text x="797" y="687" text-anchor="middle" class="stage-desc">Execution_Log</text>

  <!-- M6 Max check -->
  <rect x="880" y="635" width="115" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="937" y="660" text-anchor="middle" class="stage-name">Max Check</text>
  <text x="937" y="675" text-anchor="middle" class="stage-desc">if breaches ≥ max</text>
  <text x="937" y="687" text-anchor="middle" class="stage-desc">→ max_escalated</text>

  <!-- Lane 2 arrows -->
  <line x1="150" y1="665" x2="180" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="295" y1="665" x2="320" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="435" y1="665" x2="460" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="665" x2="600" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="665" x2="740" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="855" y1="665" x2="880" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SLA Monitor reads/writes Sheets -->
  <line x1="237" y1="635" x2="450" y2="555" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="657" y1="635" x2="597" y2="540" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="797" y1="635" x2="735" y2="540" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ==================== FOOTER LEGEND ==================== -->
  <text x="50" y="745" class="footer">Solid arrows = data flow within workflow. Dashed arrows = Google Sheets read/write. Color-coded arrows from Stage 5 = tier-specific notification path.</text>
  <text x="600" y="745" text-anchor="middle" class="footer">Built by Talvin Lee Gen Wei · PRD v1.1 LOCKED · Repo: nexus-scoring-engine</text>
</svg>
